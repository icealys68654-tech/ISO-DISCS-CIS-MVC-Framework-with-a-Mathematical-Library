services:
  - type: web
    name: iso-discs-cis-mvc
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
    disk:
      name: iso-discs-registry
      mountPath: /opt/render/project/src/data
      sizeGB: 1
